[project]
name = "hex-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for Hex Tracker, implemented against ../openapi.yaml"
authors = [
    { name = "Calder", email = "cmmyers@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
