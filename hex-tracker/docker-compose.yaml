services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hex_tracker
      POSTGRES_PASSWORD: hex_tracker
      POSTGRES_DB: hex_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hex_tracker -d hex_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://hex_tracker:hex_tracker@db:5432/hex_tracker
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
