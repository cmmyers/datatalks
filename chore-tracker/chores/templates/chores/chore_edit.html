<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Edit chore</title>
</head>
<body>
    <h1>Edit chore</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{% url 'chore_edit' chore.id %}">
        {% csrf_token %}
        <label>
            Name
            <input type="text" name="name" value="{{ chore.name }}">
        </label>
        <label>
            Room
            <input type="text" name="room" value="{{ chore.room }}">
        </label>
        <label>
            Points
            <input type="text" name="points" value="{{ chore.points }}">
        </label>
        <button type="submit">Save changes</button>
    </form>
</body>
</html>
