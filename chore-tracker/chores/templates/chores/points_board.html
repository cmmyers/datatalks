<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Points board</title>
</head>
<body>
    <h1>Points board</h1>

    {% if board %}
        <ol>
            {% for entry in board %}
                <li>{{ entry.user.name }} - {{ entry.total }} points</li>
            {% endfor %}
        </ol>
    {% else %}
        <p>No household members yet.</p>
    {% endif %}
</body>
</html>
