{% extends "chores/base.html" %}

{% block title %}Points board{% endblock %}

{% block content %}
    <h1>Points board</h1>

    {% if board %}
        <ol>
            {% for entry in board %}
                <li>{{ entry.user.name }} - {{ entry.total }} points</li>
            {% endfor %}
        </ol>
    {% else %}
        <p>No household members yet.</p>
    {% endif %}
{% endblock %}
