<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chore pool</title>
</head>
<body>
    <h1>Chore pool</h1>

    {% if chores %}
        <ul>
            {% for chore in chores %}
                <li>{{ chore.name }} - {{ chore.room }} - {{ chore.points }} points</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No open chores right now.</p>
    {% endif %}
</body>
</html>
