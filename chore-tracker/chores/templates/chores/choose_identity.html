<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Choose or create a household</title>
</head>
<body>
    <h1>Create a household</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{% url 'choose_identity' %}">
        {% csrf_token %}
        <input type="hidden" name="action" value="create">
        <label>
            Household name
            <input type="text" name="household_name">
        </label>
        <label>
            Your name
            <input type="text" name="display_name">
        </label>
        <button type="submit">Create household</button>
    </form>

    <h1>Join a household</h1>

    <form method="post" action="{% url 'choose_identity' %}">
        {% csrf_token %}
        <input type="hidden" name="action" value="join">
        <label>
            Join code
            <input type="text" name="join_code">
        </label>
        <label>
            Your name
            <input type="text" name="display_name">
        </label>
        <button type="submit">Join household</button>
    </form>

    {% if current_user %}
        <p>
            <a id="back-to-switcher-link" href="{% url 'switch_identity' %}">Back to switcher</a>
        </p>
    {% endif %}
</body>
</html>
